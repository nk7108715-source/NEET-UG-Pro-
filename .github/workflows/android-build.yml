name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEET-UG-Pro-Android-Source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android source
        run: unzip -q NEET-UG-Pro-Android-Source.zip -d android-source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preserve test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: neet-ug-pro-test-keystore-v1

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android-source
        run: gradle --no-daemon :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NEET-UG-Pro-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
